<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Feliz cumpleaños, mamá</title>
  <meta name="description" content="Un regalo hecho con amor: un recorrido por todas nuestras etapas.">
  <meta name="theme-color" content="#FBF6EE">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23B5603F' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Dancing+Script:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <!-- Íconos reutilizables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></g></symbol>
      <symbol id="i-flower" viewBox="0 0 200 260"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M100 252 C 94 204, 110 160, 100 110"/><path d="M101 206 C 70 196, 56 172, 58 152 C 82 156, 98 176, 101 206 Z"/><path d="M99 172 C 128 166, 144 146, 142 126 C 118 130, 102 150, 99 172 Z"/><g transform="translate(100 80)"><ellipse cx="0" cy="-22" rx="13" ry="24"/><ellipse cx="0" cy="-22" rx="13" ry="24" transform="rotate(72)"/><ellipse cx="0" cy="-22" rx="13" ry="24" transform="rotate(144)"/><ellipse cx="0" cy="-22" rx="13" ry="24" transform="rotate(216)"/><ellipse cx="0" cy="-22" rx="13" ry="24" transform="rotate(288)"/></g><circle cx="100" cy="80" r="7" stroke="#C9A35B"/></g></symbol>
    </defs>
  </svg>

  <main>
    <!-- 1. Portada -->
    <header id="cover" class="cover">
      <svg class="cover__flower cover__flower--left" aria-hidden="true"><use href="#i-flower"/></svg>
      <svg class="cover__flower cover__flower--right" aria-hidden="true"><use href="#i-flower"/></svg>
      <span class="petal" style="left:18%;top:16%" aria-hidden="true"></span>
      <span class="petal petal--sm" style="right:16%;top:24%;animation-delay:-3s" aria-hidden="true"></span>
      <span class="petal petal--gold" style="left:10%;bottom:26%;animation-delay:-5s" aria-hidden="true"></span>
      <span class="petal" style="right:24%;bottom:20%;animation-delay:-1.5s" aria-hidden="true"></span>
      <svg class="cover__heart" style="right:30%;top:12%;width:14px;height:14px;color:var(--rose-400)" aria-hidden="true"><use href="#i-heart"/></svg>
      <svg class="cover__heart" style="left:26%;bottom:34%;width:10px;height:10px;color:var(--gold)" aria-hidden="true"><use href="#i-heart"/></svg>

      <div id="cover-photo" class="cover-photo enter"></div>
      <p class="eyebrow cover__eyebrow enter" data-text="cover.eyebrow"></p>
      <h1 class="cover__title enter enter--d1">
        <span class="cover__title-top" data-text="cover.titleTop"></span>
        <span class="cover__title-script" data-text="cover.titleScript"></span>
      </h1>
      <div class="cover__name enter enter--d2">
        <span class="rule" aria-hidden="true"></span>
        <p data-text="momName"></p>
        <span class="rule" aria-hidden="true"></span>
      </div>
      <p class="cover__phrase enter enter--d3" data-text="cover.phrase"></p>

      <a href="#intro" class="scroll-hint">
        <span>Desliza</span>
        <svg class="bob" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </header>

    <!-- 2. Intro -->
    <section id="intro" class="intro">
      <div class="reveal intro__inner">
        <div class="divider" aria-hidden="true">
          <span></span><svg width="16" height="16"><use href="#i-heart"/></svg><span></span>
        </div>
        <p class="intro__greeting" data-text="intro.greeting"></p>
        <p class="intro__lead" data-text="intro.lead"></p>
        <p class="intro__text" data-text="intro.text"></p>
      </div>
    </section>

    <!-- 3. Línea de tiempo (se genera desde data.js) -->
    <div id="timeline" class="timeline"></div>

    <!-- 4. Carta -->
    <section id="letter" class="letter" aria-labelledby="letter-title">
      <div class="reveal letter__inner">
        <p class="eyebrow" data-text="letter.eyebrow"></p>
        <h2 id="letter-title" class="section-title" data-text="letter.title"></h2>

        <div id="envelope-wrap" class="envelope-wrap">
          <button type="button" id="envelope" class="envelope" aria-label="Abrir la carta" aria-controls="letter-paper" aria-expanded="false">
            <svg viewBox="0 0 440 290" width="100%" aria-hidden="true">
              <rect class="envelope__back" x="4" y="4" width="432" height="282" rx="14"/>
              <path class="envelope__flap" d="M8 12 L220 170 L432 12"/>
              <g class="envelope__peek"><rect x="40" y="30" width="360" height="200" rx="6" fill="#FFFDF8"/><path d="M80 70h220M80 100h280M80 130h240" stroke="#EFE3D6" stroke-width="3" stroke-linecap="round"/></g>
              <path class="envelope__front" d="M4 70 L220 182 L436 70 V272 a14 14 0 0 1 -14 14 H18 a14 14 0 0 1 -14 -14 Z"/>
              <path class="envelope__lines" d="M8 280 L180 152 M432 280 L260 152"/>
              <g class="envelope__seal">
                <circle cx="220" cy="170" r="27" fill="#C9A35B"/>
                <circle cx="220" cy="170" r="21" fill="none" stroke="#E6CC92" stroke-width="1"/>
                <path d="M220 182.5l-1.6-1.4c-5.6-5.1-9.4-8.5-9.4-12.6 0-3.4 2.6-6 6-6 1.9 0 3.8.9 5 2.3 1.2-1.4 3.1-2.3 5-2.3 3.4 0 6 2.6 6 6 0 4.1-3.8 7.5-9.4 12.6z" fill="#FFF7EA"/>
              </g>
            </svg>
          </button>
          <p class="envelope__hint">
            <svg class="bob" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            Toca el sobre para abrirla
          </p>
        </div>

        <div id="letter-paper-wrap" hidden>
          <article id="letter-paper" class="paper" tabindex="-1">
            <span class="tape" aria-hidden="true"></span>
            <p class="paper__date" data-text="letter.placeDate"></p>
            <p class="paper__greeting" data-text="letter.greeting"></p>
            <div id="letter-body"></div>
            <p class="paper__closing" data-text="letter.closing"></p>
            <p class="paper__signature" data-text="signature"></p>
          </article>
          <button type="button" id="letter-close" class="link-btn">Guardar la carta en el sobre</button>
        </div>
      </div>
    </section>

    <!-- 5. Cierre -->
    <section id="closing" class="closing" aria-labelledby="closing-title">
      <canvas id="confetti" class="closing__canvas" aria-hidden="true"></canvas>
      <div class="reveal closing__inner">
        <div id="closing-photo" class="closing-photo"></div>
        <p class="eyebrow eyebrow--wine" data-text="closing.eyebrow"></p>
        <h2 id="closing-title" class="closing__title beat" data-text="closing.title"></h2>
        <p class="closing__phrase" data-text="closing.phrase"></p>
        <a href="#cover" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          Volver al inicio
        </a>
        <div class="made-by">
          <div class="divider made-by__divider" aria-hidden="true">
            <span></span><svg width="14" height="14"><use href="#i-heart"/></svg><span></span>
          </div>
          <p class="made-by__label" data-text="closing.madeByLabel"></p>
          <p class="made-by__name" data-text="closing.madeBy"></p>
        </div>
      </div>
    </section>
  </main>

  <!-- Música -->
  <audio id="music" preload="none"></audio>
  <div id="music-player" class="music">
    <div id="music-panel" class="music__panel" hidden>
      <p class="music__heading">
        <svg width="12" height="12" aria-hidden="true"><use href="#i-heart"/></svg>
        Elige tu canción
      </p>
      <ul id="music-list" class="music__list"></ul>
    </div>
    <p class="music__hint" aria-hidden="true">Elige una canción</p>
    <button type="button" id="music-btn" class="music-btn" aria-label="Elegir canción" aria-expanded="false" aria-controls="music-panel">
      <span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>
      <svg class="music-btn__note" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
    </button>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
    <button type="button" class="lb-btn lightbox__close" id="lb-close" aria-label="Cerrar foto">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <figure class="lightbox__figure">
      <div class="lightbox__media" id="lb-media"></div>
      <figcaption class="lightbox__caption">
        <button type="button" class="lb-btn" id="lb-prev" aria-label="Foto anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <span class="lightbox__text">
          <span class="lightbox__title" id="lb-caption"></span>
          <span class="lightbox__meta" id="lb-meta"></span>
        </span>
        <button type="button" class="lb-btn" id="lb-next" aria-label="Foto siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </figcaption>
    </figure>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
